server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ── Docker container logs ─────────────────────────────────────────────────
  # Reads logs from all containers via the Docker log driver (json-file).
  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      # Parse JSON-formatted log lines emitted by the sample app
      - json:
          expressions:
            level: level
            msg: message
            timestamp: timestamp
      - labels:
          level:
          service:
      - timestamp:
          format: RFC3339
          source: timestamp

  # ── System logs ────────────────────────────────────────────────────────────
  - job_name: syslog
    static_configs:
      - targets: [localhost]
        labels:
          job: syslog
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+ \S+) (?P<host>\S+) (?P<process>\S+): (?P<message>.+)$'
      - labels:
          host:
          process:
